[pytest]
# テスト検索のパスと名前パターン
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# テスト実行オプション
addopts = 
    --strict-markers 
    -v

# テスト結果の詳細レベル
# 0: normal, 1: verbose, 2: more verbose
verbosity = 2

# テスト実行後にオープンしたファイル等のリソースをチェック
# 解放されていないリソースを検出する
xvs = True

# テストクラスや関数の名前表示を整形
console_output_style = progress

# マーカーの定義
markers =
    unit: 単体テスト
    integration: 統合テスト
    e2e: エンドツーエンドテスト
    slow: 実行に時間がかかるテスト

qt_api=pyqt6 