name: Deploy DXF Viewer to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'cross-section-ui/**'
      - 'data/計画.xlsx'
      - 'src/xlsx_parser.py'
      - 'build_from_xlsx.py'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            cross-section-ui/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('cross-section-ui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install trunk
        run: cargo install trunk --locked || true

      - name: Generate sections.json from 計画.xlsx
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl
          python src/xlsx_parser.py data/計画.xlsx data/sections.json

      - name: Build WASM with trunk
        working-directory: ./cross-section-ui
        run: trunk build --release --public-url /csv_to_dxf/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './cross-section-ui/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
