<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>横断図・切削計算システム</title>
    <link data-trunk rel="css" href="static/styles.css"/>
    <link data-trunk rel="copy-file" href="../data/sections.json"/>
    <link data-trunk rel="copy-file" href="static/pyodide_layouts.js"/>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script src="pyodide_layouts.js"></script>
    <script>
        // アプリ起動後にPyodide初期化を開始（バックグラウンド）
        window.addEventListener('TrunkApplicationStarted', () => {
            setTimeout(() => {
                if (typeof initPyodideLayouts === 'function') {
                    initPyodideLayouts();
                }
            }, 2000); // 2秒後に開始（アプリ描画を優先）
        });
    </script>
    <link data-trunk rel="rust" data-wasm-opt="0"/>
</body>
</html>
