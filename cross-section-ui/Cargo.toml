[package]
name = "cross_section_ui"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "DragEvent",
    "DataTransfer",
] }
js-sys = "0.3"
gloo = { version = "0.11", features = ["file"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen-futures = "0.4"

[profile.release]
lto = true
opt-level = "z"
