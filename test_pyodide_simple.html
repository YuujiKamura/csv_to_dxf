<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pyodide 簡易テスト</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #output { white-space: pre-wrap; background: #f0f0f0; padding: 10px; min-height: 100px; }
    </style>
</head>
<body>
    <h1>Pyodide 簡易テスト</h1>
    <div id="output">読み込み中...</div>

    <script>
        const output = document.getElementById('output');

        async function main() {
            try {
                output.textContent = 'Pyodide CDN読み込み開始...\n';

                // 動的にスクリプトを読み込む
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js';

                script.onload = async () => {
                    output.textContent += 'スクリプト読み込み完了\n';
                    output.textContent += 'Pyodide初期化中...\n';

                    try {
                        const pyodide = await loadPyodide();
                        output.textContent += 'Pyodide初期化完了!\n';

                        const result = await pyodide.runPython('1 + 1');
                        output.textContent += `Python計算結果: 1 + 1 = ${result}\n`;
                        output.textContent += '\n✓ Pyodide動作OK';
                    } catch (e) {
                        output.textContent += `初期化エラー: ${e}\n`;
                    }
                };

                script.onerror = (e) => {
                    output.textContent += `スクリプト読み込みエラー: ${e}\n`;
                };

                document.head.appendChild(script);

            } catch (e) {
                output.textContent += `エラー: ${e}`;
            }
        }

        main();
    </script>
</body>
</html>
